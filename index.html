<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dance Class Registration</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f0ff;
            color: #222;
        }

        header {
            background: #6a1b9a;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 16px;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .container h2 {
            text-align: center;
            color: #6a1b9a;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #6a1b9a;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #4a126d;
        }

        #message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #e8f5e9;
            color: #2e7d32;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <h1>💃 Dance Academy</h1>
        <p>Learn • Dance • Enjoy</p>
    </header>

    <div class="container">

        <h2>Class Registration</h2>

        <form id="registrationForm">

            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="age">Age</label>
            <input type="number" id="age" placeholder="Enter your age" required>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="dance">Select Dance Style</label>
            <select id="dance" required>
                <option value="">-- Select --</option>
                <option>Bollywood</option>
                <option>Hip Hop</option>
                <option>Classical</option>
                <option>Contemporary</option>
                <option>Free Style</option>
            </select>

            <button type="submit">Register Now</button>

        </form>

        <div id="message">
            🎉 Registration Successful!
        </div>

    </div>

    <footer>
        © 2026 Dance Academy
    </footer>

    <script>
        document.getElementById("registrationForm").addEventListener("submit", function(event) {

            event.preventDefault();

            document.getElementById("message").style.display = "block";

            document.getElementById("registrationForm").reset();

        });
    </script>

</body>
</html>
